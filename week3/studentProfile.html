```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Interactive Student Profile Card Using jQuery</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #fbc2eb, #a6c1ee);
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        /* =========================
           PROFILE CARD
        ========================= */

        #profile-card {
            width: 350px;
            background: white;
            padding: 20px;
            margin: 20px auto;
            border-radius: 15px;
            border: 2px solid #ddd;
            text-align: center;
            transition: 0.3s;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
        }

        #profile-photo {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border: 3px solid #333;
            transition: 0.3s;
        }

        /* =========================
           CLASSES
        ========================= */

        .highlighted {
            border: 5px solid gold !important;
            background: #fff8dc !important;
            box-shadow: 0px 0px 20px gold;
        }

        .dark-mode {
            background: #2c3e50 !important;
            color: white;
        }

        .rounded {
            border-radius: 50%;
        }

        .shadow {
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
        }

        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            margin-top: 20px;
            text-align: center;
        }

        button {
            margin: 6px;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }

        /* GET & SET */
        #show-name,
        #change-name,
        #show-bio,
        #get-input,
        #set-input {
            background: #3498db;
        }

        /* CSS CLASSES */
        #highlight-card,
        #remove-highlight,
        #toggle-dark,
        #toggle-rounded {
            background: #9b59b6;
        }

        /* CSS METHOD */
        #red-bg,
        #reset-bg {
            background: #e67e22;
        }

        /* HIDE & SHOW */
        #hide-photo,
        #show-photo,
        #toggle-bio {
            background: #16a085;
        }

        /* FADE */
        #fade-out,
        #fade-in,
        #fade-half {
            background: #e74c3c;
        }

        /* SLIDE */
        #slide-up,
        #slide-down,
        #slide-toggle {
            background: #2ecc71;
        }

        /* ANIMATE */
        #animate-card {
            background: #34495e;
        }

        button:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        /* =========================
           OUTPUT
        ========================= */

        #output {
            margin-top: 20px;
            padding: 12px;
            background: white;
            border: 2px solid #ccc;
            border-radius: 10px;
            min-height: 30px;
            text-align: center;
            font-weight: bold;
        }

        ul {
            text-align: left;
        }

    </style>
</head>

<body>

    <h1>🐱 Practice Profile 🐱</h1>

    <div id="profile-card">

        <!-- PROFILE IMAGE -->
        <img 
            id="profile-photo"
            src="C:\Users\Aki\Downloads\cat.jpg"
            alt="Profile Picture"
        >

        <!-- NAME -->
        <h2 id="student-name">John Doe</h2>

        <!-- BIO -->
        <p id="student-bio">
            <b>Web Development Cat</b><br>
            Loves JavaScript and jQuery.
        </p>

        <!-- INPUT -->
        <input 
            type="text" 
            id="nickname-input" 
            placeholder="Enter nickname"
            value="Meowy"
        >

        <!-- SKILLS -->
        <h3>Skills</h3>

        <ul id="skills-list">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>jQuery</li>
        </ul>

    </div>

    <!-- BUTTONS -->

    <div class="buttons">

        <h3>GET & SET</h3>

        <button id="show-name">Show Name</button>
        <button id="change-name">Change Name</button>
        <button id="show-bio">Show Bio</button>
        <button id="get-input">Get Input</button>
        <button id="set-input">Set Input</button>

        <h3>CSS CLASSES</h3>

        <button id="highlight-card">Highlight Card</button>
        <button id="remove-highlight">Remove Highlight</button>
        <button id="toggle-dark">Toggle Dark Mode</button>
        <button id="toggle-rounded">Toggle Rounded</button>

        <h3>CSS METHOD</h3>

        <button id="red-bg">Red Background</button>
        <button id="reset-bg">Reset Background</button>

        <h3>HIDE & SHOW</h3>

        <button id="hide-photo">Hide Photo</button>
        <button id="show-photo">Show Photo</button>
        <button id="toggle-bio">Toggle Bio</button>

        <h3>FADE</h3>

        <button id="fade-out">Fade Out Card</button>
        <button id="fade-in">Fade In Card</button>
        <button id="fade-half">Fade to 50%</button>

        <h3>SLIDE</h3>

        <button id="slide-up">Slide Up Skills</button>
        <button id="slide-down">Slide Down Skills</button>
        <button id="slide-toggle">Slide Toggle Skills</button>

        <h3>ANIMATE</h3>

        <button id="animate-card">Animate Card</button>

    </div>

    <!-- OUTPUT -->

    <div id="output">
        Output will appear here...
    </div>

    <!-- =========================
         JQUERY
    ========================= -->

    <script>

        $(document).ready(function () {

            // =========================
            // 1. GET & SET
            // =========================

            $("#show-name").click(function () {

                let name = $("#student-name").text();

                $("#output").text(name);

            });

            $("#change-name").click(function () {

                $("#student-name").text("Meow Meow Biralo");

            });

            $("#show-bio").click(function () {

                let bio = $("#student-bio").html();

                $("#output").text(bio);

            });

            $("#get-input").click(function () {

                let value = $("#nickname-input").val();

                $("#output").text("Nickname: " + value);

            });

            $("#set-input").click(function () {

                $("#nickname-input").val("Meowy");

                $("#output").text("Nickname set to Meowy");

            });

            // =========================
            // 2. CSS CLASSES
            // =========================

            $("#highlight-card").click(function () {

                $("#profile-card").addClass("highlighted");

            });

            $("#remove-highlight").click(function () {

                $("#profile-card").removeClass("highlighted");

            });

            $("#toggle-dark").click(function () {

                $("#profile-card").toggleClass("dark-mode");

            });

            $("#toggle-rounded").click(function () {

                $("#profile-photo").toggleClass("rounded");

            });

            // =========================
            // 3. CSS METHOD
            // =========================

            $("#red-bg").click(function () {

                $("#profile-card").css("background", "#e74c3c");

            });

            $("#reset-bg").click(function () {

                $("#profile-card").css("background", "white");

            });

            // =========================
            // 4. HIDE & SHOW
            // =========================

            $("#hide-photo").click(function () {

                $("#profile-photo").hide("slow");

            });

            $("#show-photo").click(function () {

                $("#profile-photo").show("slow");

            });

            $("#toggle-bio").click(function () {

                $("#student-bio").toggle();

            });

            // =========================
            // 5. FADE
            // =========================

            $("#fade-out").click(function () {

                $("#profile-card").fadeOut();

            });

            $("#fade-in").click(function () {

                $("#profile-card").fadeIn();

            });

            $("#fade-half").click(function () {

                $("#profile-card").fadeTo("slow", 0.5);

            });

            // =========================
            // 6. SLIDE
            // =========================

            $("#slide-up").click(function () {

                $("#skills-list").slideUp();

            });

            $("#slide-down").click(function () {

                $("#skills-list").slideDown();

            });

            $("#slide-toggle").click(function () {

                $("#skills-list").slideToggle();

            });

            // =========================
            // 7. ANIMATE
            // =========================

            $("#animate-card").click(function () {

                $("#profile-card")
                    .animate({ marginLeft: "200px" }, 1000)
                    .animate({ marginLeft: "0px" }, 1000);

            });

            // =========================
            // 8. EVENTS
            // =========================

            $("#profile-photo").mouseenter(function () {

                $(this).addClass("shadow");

            });

            $("#profile-photo").mouseleave(function () {

                $(this).removeClass("shadow");

            });

            // LIVE INPUT DISPLAY

            $("#nickname-input").keyup(function () {

                let nickname = $(this).val();

                $("#output").text("Nickname: " + nickname);

            });

        });

    </script>

</body>
</html>
```
